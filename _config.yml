7. VBA Stomping
7.1 What Is VBA Stomping?
VBA macros in Office documents are stored in two forms:

Source code: Compressed VBA source in the module stream.
P-code: Pre-compiled bytecode in the _VBA_PROJECT stream.
Office executes the p-code (not the source code) if the VBA version matches. VBA stomping replaces the source code with benign code while preserving the malicious p-code.

Result: Analysts examining the VBA source see innocent code, but execution runs the malicious p-code.

7.2 How It Works
Normal document:
  Source code: malicious VBA    -->  P-code: malicious bytecode  [MATCH]
  Office executes p-code

Stomped document:
  Source code: benign VBA       -->  P-code: malicious bytecode  [MISMATCH but runs p-code]
  Analysts see benign source
  Office executes malicious p-code
7.3 Limitations
Version-specific: P-code is compiled for a specific VBA version (e.g., VBA7 in Office 2016). If the target has a different version, Office recompiles from source -- executing the benign code instead.
Detection: Tools like pcodedmp can disassemble p-code, revealing the mismatch.
7.4 Implementation
See vba_stomper.py in the code files. The process:

Open the vbaProject.bin OLE stream.
Locate the module streams (e.g., ThisDocument, Module1).
Decompress the source code using the VBA compression algorithm.
Replace the decompressed source with benign code.
Recompress using the same algorithm.
Write back to the module stream, preserving the p-code section.
8. Macro Security Bypass Techniques
8.1 Mark-of-the-Web Removal
Since 2022, Office blocks macros in files with MoTW. Bypass methods:

Deliver inside ISO/IMG containers (MoTW not applied to contents).
Use 7-zip to extract (historically didn't preserve MoTW -- now patched).
Deliver via network shares (UNC paths don't get MoTW).
8.2 Trusted Documents
Once a user clicks "Enable Content," that document is added to Trusted Documents. If the user opens it again, macros run without prompting.

8.3 Trusted Locations
Documents in Trusted Locations run macros without any prompt:

%APPDATA%\Microsoft\Templates\        (default trusted)
Custom paths added by Group Policy
8.4 Group Policy Override
If the target organization sets "Disable VBA for Office applications" via GPO, macros are completely blocked. Verify this in reconnaissance.

9. Document Preparation
9.1 Creating the DOCM
# Create macro-enabled document
$word = New-Object -ComObject Word.Application
$word.Visible = $false
$doc = $word.Documents.Add()

# Add VBA module
$vbProject = $doc.VBProject
$module = $vbProject.VBComponents.Add(1)  # 1 = vbext_ct_StdModule
$module.CodeModule.AddFromString $vbaCode

# Save as macro-enabled
$doc.SaveAs("C:\Temp\Invoice.docm", 13)  # 13 = wdFormatXMLDocumentMacroEnabled
$word.Quit()
9.2 Metadata Sanitization
' Remove metadata before distribution
With ActiveDocument
    .RemoveDocumentInformation wdRDIAll
    .BuiltInDocumentProperties("Author").Value = "HR Department"
    .BuiltInDocumentProperties("Company").Value = "Target Corp"
End With
10. OPSEC Considerations
AMSI integration: Office 365 integrates AMSI, which scans VBA before execution. Use AMSI bypass techniques (memory patching of AmsiScanBuffer) or obfuscate heavily.
ETW logging: VBA execution generates ETW events. Use COM-based execution to reduce direct VBA artifacts.
Process tree: WINWORD.EXE -> cmd.exe -> powershell.exe is a well-known malicious pattern. Use WMI or scheduled tasks to break the chain.
File format: .docm is obviously macro-enabled. Consider .doc (legacy format) or .dotm (template) for less scrutiny.
Payload staging: Don't embed the full implant in the macro. Download a stager that fetches the main payload -- reduces macro size and VT detection.
11. Lab Exercise
Create a DOCM with an AutoOpen macro that executes calc.exe via WMI.
Add sandbox evasion checks (memory, processor count, username).
Obfuscate the VBA code using string construction and variable renaming.
Use vba_stomper.py to replace the source code with benign code.
Test execution -- verify calc.exe still runs despite benign source.
Analyze with olevba and pcodedmp to see the stomping effect.

